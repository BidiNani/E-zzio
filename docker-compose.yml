services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ezzio-open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      - ANONYMIZED_TELEMETRY=false
      - WEBUI_SECRET_KEY=ezzio_super_secret_session_key_2026
      - WEBUI_AUTH=true
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ezzio-network

volumes:
  open-webui-data:
    name: ezzio_openwebui_storage

networks:
  ezzio-network:
    name: ezzio_bridge_net
    driver: bridge
