services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ezzio-open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      - ANONYMIZED_TELEMETRY=false
      # Cle de session open-webui : OBLIGATOIRE, aucune valeur par defaut.
      # Avant, une cle en clair etait versionnee dans ce fichier : toute personne
      # ayant lu le depot pouvait forger un cookie de session admin sur une
      # instance exposee. Cette valeur est aussi dans la denylist de
      # core.security.api_key.
      # Generer : python -c "import secrets;print(secrets.token_urlsafe(48))"
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY est obligatoire. Definissez-la dans un .env local (non versionne) ou dans votre gestionnaire de secrets.}
      - WEBUI_AUTH=true
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ezzio-network

volumes:
  open-webui-data:
    name: ezzio_openwebui_storage

networks:
  ezzio-network:
    name: ezzio_bridge_net
    driver: bridge
