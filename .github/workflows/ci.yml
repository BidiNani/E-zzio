name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-frozen.txt ]; then pip install -r requirements-frozen.txt; fi
          pip install pytest pytest-asyncio ruff

      - name: Ruff (lint + format check)
        run: ruff check . && ruff format --check .

      - name: Frozen Core gate
        run: python -m core.frozen_core.manifest

      - name: Run tests
        run: pytest tests/ -q --tb=short

  powershell-lint:
    name: PowerShell lint (watchdog + scripts)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: PSScriptAnalyzer (errors + warnings)
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning `
                    -ExcludeRule PSAvoidUsingWriteHost
          if ($issues) {
            $issues | Format-Table -AutoSize
            exit 1
          }
          Write-Host "PSScriptAnalyzer : OK"

      - name: Parse all .ps1 files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "❌ $($_.Name)"
              $errors | ForEach-Object {
                Write-Host "  L$($_.Extent.StartLineNumber): $($_.Message)"
              }
              $failed = $true
            } else {
              Write-Host "✅ $($_.Name) ($($tokens.Count) tokens)"
            }
          }
          if ($failed) { exit 1 }

      - name: Smoke test watchdog (5s)
        shell: pwsh
        run: |
          $job = Start-Job { pwsh -NoProfile -File ./watchdog.ps1 2>&1 }
          Start-Sleep -Seconds 5
          $out = Receive-Job $job
          Stop-Job $job -ErrorAction SilentlyContinue
          Remove-Job $job -Force -ErrorAction SilentlyContinue
          $out | Write-Host
          if ($out -notmatch "Watchdog démarré") {
            Write-Error "Watchdog ne démarre pas correctement"
            exit 1
          }

  frozen-core-gate:
    name: Frozen Core integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Frozen Core (no deps needed)
        run: python -m core.frozen_core.manifest