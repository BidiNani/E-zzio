name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-frozen.txt ]; then pip install -r requirements-frozen.txt; fi
          pip install pytest pytest-asyncio ruff

      - name: Ruff (lint + format check)
        run: ruff check .

      - name: Frozen Core gate
        run: python -m core.frozen_core.manifest

      - name: Run tests
        run: pytest tests/ -q --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  powershell-lint:
    name: PowerShell lint (scripts)
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: PSScriptAnalyzer (errors + warnings)
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error `
                    -ExcludeRule PSAvoidUsingWriteHost |
                    Where-Object { $_.ScriptPath -notmatch '\\(_archive|_broken_ps1|\.venv)\\' }
          if ($issues) {
            $issues | Format-Table -AutoSize
            exit 1
          }
          Write-Host "PSScriptAnalyzer : OK"

      - name: Parse all .ps1 files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | Where-Object { $_.FullName -notmatch '\\(_archive|_broken_ps1|\.venv)\\' } | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "❌ $($_.Name)"
              $errors | ForEach-Object {
                Write-Host "  L$($_.Extent.StartLineNumber): $($_.Message)"
              }
              $failed = $true
            } else {
              Write-Host "✅ $($_.Name) ($($tokens.Count) tokens)"
            }
          }
          if ($failed) { exit 1 }


  frozen-core-gate:
    name: Frozen Core integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify Frozen Core (no deps needed)
        run: python -m core.frozen_core.manifest
  contract-validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest

      - name: Contract validation (providers registry)
        run: python scripts/check_contracts.py

      - name: Contract tests
        run: python -m pytest tests/contracts/ -q
