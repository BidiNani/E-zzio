<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>E-ZZIO // DATA TUNNEL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #03050a;
            color: #d9e3f5;
            font-family: "Segoe UI", Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        #scene-canvas {
            position: absolute;
            inset: 0;
            z-index: 0;
        }
        .overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(6, 10, 20, 0.25) 0%, rgba(3, 5, 10, 0.92) 80%);
            z-index: 1;
            pointer-events: none;
        }
        header {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: linear-gradient(180deg, rgba(6, 10, 18, 0.5), rgba(6, 10, 18, 0.15));
            backdrop-filter: blur(4px);
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #cdd8ef;
        }
        header h1 {
            font-size: 1rem;
            font-weight: 700;
            color: #eef4ff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.1);
        }
        .status {
            padding: 4px 9px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.03);
            font-weight: 600;
            font-size: 0.7rem;
            color: #cfe3ff;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.05);
            animation: glow 3s infinite;
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 4px rgba(255, 255, 255, 0.05); }
            50% { box-shadow: 0 0 12px rgba(255, 255, 255, 0.12); }
        }
        .tunnel-ui {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
        }
        .chat-panel {
            position: absolute;
            left: 10%;
            top: 50%;
            transform: translateY(-50%);
            width: 26%;
            max-height: 55%;
            background: rgba(8, 12, 22, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px;
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .chat-panel h2 {
            font-size: 0.8rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #dce5f6;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 8px;
            padding-right: 4px;
            font-size: 0.85rem;
        }
        .message {
            margin-bottom: 8px;
            padding: 7px 9px;
            border-radius: 7px;
            max-width: 90%;
            line-height: 1.3;
        }
        .message.user {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .message.assistant {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .input-row {
            display: flex;
            gap: 6px;
        }
        .input-row input {
            flex: 1;
            background: rgba(6, 9, 16, 0.8);
            color: #d9e3f5;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 7px;
            padding: 7px;
            font-family: inherit;
            outline: none;
            font-size: 0.85rem;
        }
        .input-row button {
            background: linear-gradient(90deg, #3b5a8a, #6fa3d9);
            color: #f2f5f9;
            border: none;
            border-radius: 7px;
            padding: 7px 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .metrics-panel {
            position: absolute;
            right: 8%;
            top: 10%;
            width: 22%;
            max-height: 40%;
            background: rgba(8, 12, 22, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px;
            backdrop-filter: blur(6px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .metrics-panel h2 {
            font-size: 0.8rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #dce5f6;
        }
        .metric {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .metric .label {
            font-size: 0.7rem;
            color: #aebacf;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .metric .value {
            font-size: 1rem;
            font-weight: 700;
            color: #eef4ff;
        }
        .logs-panel {
            position: absolute;
            left: 50%;
            bottom: 8%;
            transform: translateX(-50%);
            width: 55%;
            max-height: 22%;
            background: rgba(8, 12, 22, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px;
            backdrop-filter: blur(6px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            font-size: 0.8rem;
            color: #c5cfdf;
        }
        .logs-panel h2 {
            font-size: 0.8rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #dce5f6;
        }
        .log-line {
            margin-bottom: 6px;
            opacity: 0.9;
            padding-left: 8px;
            border-left: 2px solid rgba(255, 255, 255, 0.1);
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(5, 8, 14, 0.6); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #2a3a5a, #4a6a9a);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <canvas id="scene-canvas"></canvas>
    <div class="overlay"></div>

    <header>
        <h1>E‑ZZIO // DATA TUNNEL</h1>
        <div class="status">Système opérationnel</div>
    </header>

    <div class="tunnel-ui">
        <!-- CHAT -->
        <section class="chat-panel">
            <h2>Console</h2>
            <div class="messages" id="messages"></div>
            <div class="input-row">
                <input type="text" id="chat-input" placeholder="Entrez votre commande..." />
                <button id="send-btn">ENVOYER</button>
            </div>
        </section>

        <!-- MÉTRIQUES -->
        <aside class="metrics-panel">
            <h2>Télémétrie</h2>
            <div class="metric">
                <div class="label">Requêtes totales</div>
                <div class="value" id="total-requests">0</div>
            </div>
            <div class="metric">
                <div class="label">Latence moyenne</div>
                <div class="value" id="avg-latency">N/A</div>
            </div>
            <div class="metric">
                <div class="label">Provider le plus utilisé</div>
                <div class="value" id="top-provider">N/A</div>
            </div>
        </aside>

        <!-- LOGS -->
        <section class="logs-panel">
            <h2>Journal d'activité</h2>
            <div id="logs"></div>
        </section>
    </div>

    <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
    <script>
        // ---- THREE.JS : TUNNEL ----
        const canvas = document.getElementById('scene-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.z = 5;

        const rings = [];
        const ringCount = 40;
        const ringRadius = 6;
        const ringSpacing = 1.2;

        const ringGeo = new THREE.TorusGeometry(ringRadius, 0.04, 8, 64);
        const ringMat = new THREE.MeshBasicMaterial({
            color: 0x6fa3d9,
            transparent: true,
            opacity: 0.12
        });

        for (let i = 0; i < ringCount; i++) {
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.z = -i * ringSpacing;
            scene.add(ring);
            rings.push(ring);
        }

        const particlesGeo = new THREE.BufferGeometry();
        const particleCount = 400;
        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = Math.random() * ringRadius * 0.9;
            positions[i * 3] = Math.cos(angle) * r;
            positions[i * 3 + 1] = Math.sin(angle) * r;
            positions[i * 3 + 2] = -Math.random() * ringCount * ringSpacing;
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particlesMat = new THREE.PointsMaterial({
            color: 0x9fbce9,
            size: 0.05,
            transparent: true,
            opacity: 0.6
        });
        const particles = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particles);

        const ambient = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambient);

        let time = 0;
        let waveSpeedBoost = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            const speed = 0.04 + waveSpeedBoost;
            rings.forEach((ring, i) => {
                ring.position.z += speed;
                if (ring.position.z > 5) {
                    ring.position.z = -ringCount * ringSpacing + (i * ringSpacing);
                }
                ring.rotation.x = time * 0.1;
                ring.rotation.y = time * 0.05;
            });

            const posArr = particles.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                posArr[i * 3 + 2] += speed * 1.2;
                if (posArr[i * 3 + 2] > 5) {
                    posArr[i * 3 + 2] = -ringCount * ringSpacing * 0.9;
                }
            }
            particles.geometry.attributes.position.needsUpdate = true;

            // Décélération progressive du boost
            if (waveSpeedBoost > 0) {
                waveSpeedBoost *= 0.95;
                if (waveSpeedBoost < 0.001) waveSpeedBoost = 0;
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        });

        // ---- UI : CHAT + STATS ----
        const API_BASE = "http://127.0.0.1:8001";
        const API_KEY = "ezzio_secret_key_local_dev";

        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const totalReqEl = document.getElementById('total-requests');
        const avgLatEl = document.getElementById('avg-latency');
        const topProvEl = document.getElementById('top-provider');
        const logsEl = document.getElementById('logs');

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = text;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function addLog(line) {
            const div = document.createElement('div');
            div.className = 'log-line';
            div.textContent = line;
            logsEl.appendChild(div);
            logsEl.scrollTop = logsEl.scrollHeight;
        }

        function triggerWave() {
            waveSpeedBoost = 0.2; // accélération visuelle du tunnel
        }

        async function loadStats() {
            try {
                const res = await fetch(`${API_BASE}/api/v1/stats`, {
                    headers: { "X-API-Key": API_KEY }
                });
                if (!res.ok) return;
                const data = await res.json();
                totalReqEl.textContent = data.total_requests ?? 0;
                avgLatEl.textContent = data.avg_latency_ms ? `${data.avg_latency_ms.toFixed(1)} ms` : "N/A";
                topProvEl.textContent = data.top_provider ?? "N/A";
            } catch (e) {
                // silencieusement
            }
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text) return;
            inputEl.value = "";

            addMessage('user', `[USER] ${text}`);
            addLog(`[OUT] POST /api/v1/chat – message envoyé`);
            triggerWave();

            try {
                const t0 = performance.now();
                const res = await fetch(`${API_BASE}/api/v1/chat`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-API-Key": API_KEY
                    },
                    body: JSON.stringify({ message: text, user_id: "hud_user" })
                });
                const t1 = performance.now();
                const latency = t1 - t0;

                if (!res.ok) {
                    addMessage('assistant', `[E-ZZIO] Erreur HTTP ${res.status}`);
                    addLog(`[ERR] POST /api/v1/chat – HTTP ${res.status} – ${latency.toFixed(0)} ms`);
                    return;
                }

                const data = await res.json();
                const answer = data.response || data.data?.text || JSON.stringify(data);
                addMessage('assistant', `[E-ZZIO] ${answer}`);
                addLog(`[OK] POST /api/v1/chat – provider: ${data.provider ?? "?"} – ${latency.toFixed(0)} ms`);

                // Notif stats (optionnel)
                fetch(`${API_BASE}/api/v1/stats/notify`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-API-Key": API_KEY
                    },
                    body: JSON.stringify({
                        provider: data.provider ?? "unknown",
                        latency_ms: latency
                    })
                }).catch(() => {});

                loadStats();
            } catch (e) {
                addMessage('assistant', `[E-ZZIO] Erreur: ${e.message}`);
                addLog(`[ERR] POST /api/v1/chat – ${e.message}`);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Init
        loadStats();
        addLog("[INIT] HUD tunnel connecté à l'API");
    </script>
</body>
</html>
