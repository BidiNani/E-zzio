[pytest]
testpaths = tests
norecursedirs = .venv __pycache__ .git _archive state build dist
markers =
    integration: tests necessitant des services externes (serveur web, DB, artefacts)
    slow: tests lents (>10s)
    hardware: tests necessitant un peripherique ou artefact local (APK, device)
    visual: tests de certification visuelle (PNG/video/rapports)

# Par defaut : skipper les tests visuels et d'integration
addopts = -m "not integration and not visual and not hardware" -q
