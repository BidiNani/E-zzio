[pytest]
testpaths = tests
# --basetemp est obligatoire sur cette machine.
# Sans lui, pytest utilise les repertoires numerotes du TEMP systeme
# (%LOCALAPPDATA%\Temp\pytest-of-enrik\) et cree un lien symbolique
# `pytest-current` dont le nettoyage echoue en
# "PermissionError: [WinError 5] Acces refuse" pendant pytest_sessionfinish.
# Resultat : les tests passent mais pytest sort en code 1, ce qui declenche
# des boucles de relance infinies cote agent.
# Avec un --basetemp local, ce mecanisme n'est jamais instancie.
addopts = -q --strict-markers --tb=short -m "not visual and not hardware" --basetemp=tmp_pytest
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
markers =
    unit: Isolated unit tests
    integration: Integration tests requiring external or multi-component setup
    e2e: End-to-end tests requiring web server or browser Chromium
    slow: Slow running tests (>10s)
    hardware: Tests requiring physical hardware (skipped by default)
    visual: Visual certification tests PNG/video (skipped by default)
filterwarnings =
    ignore::DeprecationWarning:discord.*
    ignore::DeprecationWarning:aiosqlite.*
    ignore::starlette.exceptions.StarletteDeprecationWarning
