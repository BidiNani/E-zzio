[pytest]
filterwarnings =
    ignore:.*starlette\.testclient.*
    ignore:.*httpx2.*
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

testpaths =
    tests

python_files = test_*.py
python_functions = test_*

norecursedirs = tests/_quarantine_dead_imports

markers =
    hardware: tests requiring connected physical devices (Android USB, audio interface)
    optional_model: tests requiring optional heavy weights or optional native libraries (Kokoro ONNX, local models)
    live_provider: tests requiring live cloud credentials and active network access

    ignore::starlette.exceptions.StarletteDeprecationWarning
