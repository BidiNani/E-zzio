repos:
  - repo: local
    hooks:
      - id: check-contracts
        name: "[contracts] validation providers <-> code"
        entry: python scripts/check_contracts.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: check-yaml-local
        name: "[yaml] validation syntaxique"
        entry: python -c "import sys, yaml; [yaml.safe_load(open(f, encoding='utf-8')) for f in sys.argv[1:]]"
        language: system
        types: [yaml]
        pass_filenames: true
