[project]
name = "ezzio-os"
version = "1.0.0"
description = "E-ZZIO Sovereign Autonomous Intelligence System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "ollama>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

extend-exclude = [
    ".venv",
    "scripts/_archive_migration",
    "runtime/test_isolation",
    "runtime/evidence",
    "runtime/decisions",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line-too-long
    "B008",  # function-call-in-default-argument (FastAPI Depends)
    "E402",  # module-import-not-at-top (lazy imports)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]  # imports/vars non utilisés dans les tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --tb=short -m 'not visual and not hardware'"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "e2e: End-to-end tests (necessitent serveur web + browser Chromium)",
    "slow: tests lents (>10s)",
    "hardware: requires physical hardware",
    "integration: requires external services",
    "visual: tests de certification visuelle (PNG/video)",
]
filterwarnings = [
    "ignore::DeprecationWarning:discord.*",
    "ignore::DeprecationWarning:aiosqlite.*",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["core", "routers", "runtime"]
omit = [
    "*/tests/*",
    "*/_archive/*",
    "*/runtime/temp/*",
    "*/__pycache__/*",
    "*/.venv/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
