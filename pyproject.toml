[project]
name = "ezzio-os"
version = "1.0.0"
description = "E-ZZIO Sovereign Autonomous Intelligence System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "ollama>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 140
target-version = "py311"

src = ["core", "runtime/core", "routers", "interfaces", "tests"]
exclude = [
    ".venv",
    "runtime/test_isolation",
    "runtime/evidence",
    "runtime/decisions"
]

[tool.ruff.lint]
select = [
    "E", "F", "W", "W605",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B904",
    "UP042",
    "E402",    # Imports après sys.path (isolation)
    "E701",    # Multiples déclarations par ligne
    "E722",    # Bare except legacy
    "E741",    # Variables à lettre unique
    "F811",    # Redéfinitions legacy conservées pour rétrocompatibilité
]

[tool.pyflakes]
exclude = ["runtime/temp/", "runtime/temp/**/*.py", "_archive/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --tb=short -m 'not integration'"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "e2e: End-to-end tests (necessitent serveur web + browser Chromium)",
    "slow: tests lents (>10s)",
    "hardware: requires physical hardware",
    "integration: requires external services",
]
filterwarnings = [
    "ignore::DeprecationWarning:discord.*",
    "ignore::DeprecationWarning:aiosqlite.*",
]

[tool.coverage.run]
source = ["core", "routers", "runtime"]
omit = [
    "*/tests/*",
    "*/_archive/*",
    "*/runtime/temp/*",
    "*/__pycache__/*",
    "*/.venv/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
